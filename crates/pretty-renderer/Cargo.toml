[package]
name = "pretty-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "wgpu rendering abstraction, Vulkan/GLES drivers and text/graphics rendering for Pretty"

[features]
# Vulkan + GLES stay the default on Linux (the platform this release is tested
# on). Windows release builds add `dx` and macOS release builds add `metal`;
# `auto` then prefers Direct3D 12 on Windows and Metal on macOS respectively.
default = ["vulkan", "gles"]
vulkan = ["wgpu/vulkan"]
gles = ["wgpu/gles"]
metal = ["wgpu/metal"]
dx = ["wgpu/dx12"]

[dependencies]
pretty-core.workspace = true
bytemuck.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
fontdb.workspace = true
image.workspace = true
log.workspace = true
pollster.workspace = true
rustybuzz.workspace = true
serde.workspace = true
swash.workspace = true
thiserror.workspace = true
ttf-parser.workspace = true
wgpu.workspace = true
winit.workspace = true
