[package]
name = "pretty-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Pretty, a hardware accelerated kitty-compatible terminal emulator"

[[bin]]
name = "pretty"
path = "src/main.rs"

[features]
default = ["vulkan", "gles"]
vulkan = ["pretty-renderer/vulkan"]
gles = ["pretty-renderer/gles"]
metal = ["pretty-renderer/metal"]
dx = ["pretty-renderer/dx"]
# NativeActivity glue for the android_main entry point. The AndroidApp type is
# imported through winit's `android_activity` re-export, so no direct
# android-activity dependency is declared (a second copy could link duplicate
# glue).
android = ["winit/android-native-activity"]

[dependencies]
pretty-core.workspace = true
pretty-renderer.workspace = true
crossbeam-channel.workspace = true
directories.workspace = true
fontdb.workspace = true
image.workspace = true
egui.workspace = true
egui-winit.workspace = true
env_logger.workspace = true
log.workspace = true
open.workspace = true
pollster.workspace = true
serde.workspace = true
toml.workspace = true
wgpu.workspace = true
winit.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3.7"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
x11rb.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# winit 0.30 does not implement the Wayland data-device protocol, so native
# Wayland windows never receive winit's DroppedFile/HoveredFile events. This
# crate attaches a second event queue to the window's wl_display (the same
# mechanism Smithay uses for clipboard) and exposes incoming file drops.
guth-wayland-dnd = "=0.1.3"
